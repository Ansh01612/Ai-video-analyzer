[project]
name = "ai-video-assistant"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "imageio-ffmpeg>=0.6.0",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.0.0",
